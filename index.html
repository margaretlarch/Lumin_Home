<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lumin Home</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1410">
  <link href="styles.css" rel="stylesheet" />
  <link href="styles-modules.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
  <div id="app">
    <div id="background"></div>
    <div id="bg-overlay"></div>
    <div id="weather-fx"></div>
    <div id="content" class="tab-home"></div>

    <nav class="tabbar">
      <button id="tab-home" onclick="switchTab('home')" class="active">
        <span class="tab-icon">*</span>
        <span class="tab-label">HOME</span>
      </button>
      <button id="tab-play" onclick="switchTab('play')">
        <span class="tab-icon">></span>
        <span class="tab-label">PLAY</span>
      </button>
      <button id="tab-memory" onclick="switchTab('memory')">
        <span class="tab-icon">+</span>
        <span class="tab-label">MEMORY</span>
      </button>
      <button id="tab-footprint" onclick="switchTab('footprint')" class="dimmed">
        <span class="tab-icon">~</span>
        <span class="tab-label">FOOTPRINT</span>
      </button>
      <button id="tab-settings" onclick="switchTab('settings')">
        <span class="tab-icon">=</span>
        <span class="tab-label">SETTINGS</span>
      </button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="jukebox.js"></script>
  <script src="tally.js"></script>
  <script src="reading.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
