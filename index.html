<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lumin Home</title>
  <link rel="manifest" href="manifest.json">
  <link href="styles.css" rel="stylesheet" />
</head>

<body>
  <div id="app">
    <div id="background"></div>
    <div id="bg-overlay"></div>
    <div id="content" class="tab-home"></div>

    <nav class="tabbar">
      <button id="tab-home" onclick="switchTab('home')" class="active">
        <span class="tab-icon">*</span>
        <span class="tab-label">HOME</span>
      </button>
      <button id="tab-play" onclick="switchTab('play')">
        <span class="tab-icon">></span>
        <span class="tab-label">PLAY</span>
      </button>
      <button id="tab-memory" onclick="switchTab('memory')">
        <span class="tab-icon">+</span>
        <span class="tab-label">MEMORY</span>
      </button>
      <button id="tab-footprint" onclick="switchTab('footprint')" class="dimmed">
        <span class="tab-icon">~</span>
        <span class="tab-label">FOOTPRINT</span>
      </button>
      <button id="tab-settings" onclick="switchTab('settings')">
        <span class="tab-icon">=</span>
        <span class="tab-label">SETTINGS</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
